# ============================
# SIM24 — Nginx for HOST-MODE PM2 deployment
# (ecosystem.config.js — 2× cluster workers on 127.0.0.1:3000)
#
# Usage (host nginx):
#   nginx -c /path/to/sim24/nginx/nginx-pm2.conf
# or include this file from the main config.
# Docker-compose users: keep nginx/nginx.conf (upstream app1/app2).
# ============================

worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    # ─── Keepalive (spec: 65s) ───
    keepalive_timeout 65;
    keepalive_requests 10000;

    # ─── Gzip ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ─── Uploads (spec: 20m) ───
    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # ─── Upstream: PM2 cluster (single port, N workers behind it) ───
    upstream sim24_cluster {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    # ─── Rate limiting zones (LAN-friendly limits) ───
    limit_req_zone  $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=form_limit:10m  rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 80;
        server_name _;

        access_log off;
        error_log  logs/sim24-error.log warn;

        # ─── Security headers ───
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ─── Next.js static assets (immutable, hashed) ───
        location /_next/static/ {
            proxy_pass http://sim24_cluster;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ─── Auth endpoints (stricter limiting) ───
        location /api/auth/ {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://sim24_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ─── Form submissions ───
        location /api/forms/ {
            limit_req zone=form_limit burst=10 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://sim24_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ─── Everything else (pages + API) ───
        location / {
            proxy_pass http://sim24_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_next_upstream error timeout http_500 http_502 http_503;
        }
    }
}
