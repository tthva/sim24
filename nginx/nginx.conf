# ============================
# SIM24 — Advanced Nginx Configuration
# ============================

# ─── Upstream: Load Balanced Next.js Instances ───
upstream nextjs_cluster {
    # Least connections + keepalive for optimal distribution
    least_conn;
    
    server app1:3000 max_fails=5 fail_timeout=30s weight=1;
    server app2:3000 max_fails=5 fail_timeout=30s weight=1;
    
    keepalive 128;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

# ─── Cloudflare Real IP Configuration ───
# Trust Cloudflare's proxy IP ranges
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2c0f:f248::/32;
set_real_ip_from 2a06:98c0::/29;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# ─── HTTP → HTTPS Redirect ───
# server {
#     listen 80;
#     server_name sim24.ir www.sim24.ir;
#     return 301 https://$server_name$request_uri;
# }

server {
    listen 80;
    server_name _;

    # ─── Upstream DNS resolution ───
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ─── Gzip Compression ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_disable "msie6";
    gzip_static on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2
        application/vnd.ms-fontobject
        application/x-font-ttf;

    # ─── Brotli Compression (if module available) ───
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ─── Security Headers ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com; frame-src 'self';" always;
    add_header X-Robots-Tag "index, follow" always;

    # ─── Hide Nginx version ───
    server_tokens off;

    # ─── Client limits (prevent abuse) ───
    client_max_body_size 20M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65;

    # ─── Rate Limiting Zones ───
    # General API: 30 req/s per IP
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=30r/s;
    # Login endpoint: 5 req/min per IP
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # Form submission: 10 req/min per IP
    limit_req_zone $binary_remote_addr zone=form_limit:10m rate=10r/m;
    # Burst protection per IP for static
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ─── Proxy Cache Configuration ───
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:50m max_size=1g inactive=7d use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # ─── Logging ───
    log_format detailed '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       '$request_time $upstream_response_time $upstream_addr';

    access_log /var/log/nginx/access.log detailed buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # ─── Health check endpoint (bypasses rate limiting) ───
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ─── Static files cache (Next.js build artifacts) ───
    location /_next/static {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache static_cache;
        proxy_cache_valid 200 301 302 365d;
        proxy_cache_valid 404 1m;
        proxy_cache_revalidate on;
        proxy_cache_min_uses 1;
        proxy_cache_bypass $http_cache_control;

        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header X-Cache-Status $upstream_cache_status;

        expires 365d;
        access_log off;
    }

    # ─── Static assets (uploads, etc.) ───
    location /static {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache static_cache;
        proxy_cache_valid 200 301 302 7d;
        proxy_cache_valid 404 1m;

        add_header Cache-Control "public, max-age=604800";
        add_header X-Cache-Status $upstream_cache_status;

        expires 7d;
    }

    # ─── Public assets ───
    location /public {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache static_cache;
        proxy_cache_valid 200 301 302 7d;

        add_header Cache-Control "public, max-age=604800";
        add_header X-Cache-Status $upstream_cache_status;

        expires 7d;
        access_log off;
    }

    # ─── Fonts cache ───
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache static_cache;
        proxy_cache_valid 200 301 302 365d;

        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header X-Cache-Status $upstream_cache_status;

        expires 365d;
        access_log off;
    }

    # ─── Images cache ───
    location ~* \.(jpg|jpeg|png|gif|webp|avif|ico)$ {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache static_cache;
        proxy_cache_valid 200 301 302 30d;

        add_header Cache-Control "public, max-age=2592000";
        add_header X-Cache-Status $upstream_cache_status;

        expires 30d;
        access_log off;
    }

    # ─── API routes (with rate limiting + caching) ───
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Remove CF headers from upstream to avoid header injection
        proxy_set_header X-CF-Connecting-IP "";
        proxy_set_header X-CF-IPCountry "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        # Don't cache API responses
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ─── Auth endpoints (stricter rate limiting) ───
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }

    # ─── Form submission endpoints ───
    location /api/forms/ {
        limit_req zone=form_limit burst=5 nodelay;
        limit_conn conn_limit 5;

        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # ─── WebSocket support ───
    location /_next/webpack-hmr {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ─── Generic WebSocket routes (if needed) ───
    location ~* /ws/ {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # ─── Main application fallback ───
    location / {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # ─── Custom error page ───
        error_page 502 503 504 /50x.html;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

