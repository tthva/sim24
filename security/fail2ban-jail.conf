# ============================
# SIM24 — Fail2Ban Configuration
# ============================
# Place this in /etc/fail2ban/jail.d/sim24.conf on the host

[DEFAULT]
# Ban hosts for 1 hour
bantime = 3600

# Find failures within last 10 minutes
findtime = 600

# After 5 failures, ban
maxretry = 5

# Ignore self
ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12

# Ban action
banaction = ufw

# ─── SSH Protection ───
[sshd]
enabled = true
port = ssh
filter = sshd
logpath = /var/log/auth.log
maxretry = 5
bantime = 3600

# ─── Nginx Rate Limit Protection ───
[nginx-http-auth]
enabled = true
port = http,https
filter = nginx-http-auth
logpath = /var/log/nginx/error.log
maxretry = 10
bantime = 600

# ─── Nginx Bad Bots ───
[nginx-badbots]
enabled = true
port = http,https
filter = nginx-badbots
logpath = /var/log/nginx/access.log
maxretry = 1
bantime = 86400

# ─── Nginx No Such Host (404 abuse) ───
[nginx-nohome]
enabled = true
port = http,https
filter = nginx-nohome
logpath = /var/log/nginx/access.log
maxretry = 10
bantime = 3600

# ─── Docker Container Monitoring ───
[docker-nginx]
enabled = true
port = http,https
filter = nginx-filter
logpath = /var/lib/docker/containers/*/*-json.log
maxretry = 20
bantime = 600