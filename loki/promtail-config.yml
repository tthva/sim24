# ============================
# SIM24 — Promtail Log Collector Configuration
# ============================

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchsize: 1048576
    batchwait: 5s
    backoff_config:
      min_period: 100ms
      max_period: 5s
      max_retries: 10
    timeout: 10s

scrape_configs:
  # ─── Docker Container Logs ───
  - job_name: docker
    pipeline_stages:
      - docker: {}
      - regex:
          expression: "^(?P<container_name>\\S+)"
      - labels:
          container_name: ""
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          service: sim24
          __path__: /var/lib/docker/containers/*/*-json.log

  # ─── Nginx Access Logs ───
  - job_name: nginx-access
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+) (?P<protocol>\S+)" (?P<status>\d+) (?P<body_bytes>\d+)'
      - labels:
          job: nginx
          type: access
      - metrics:
          nginx_http_requests_total:
            type: Counter
            description: "Total number of HTTP requests"
            prefix: "nginx_"
            max_idle_duration: 24h
            config:
              match_all: true
              action: inc
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          service: sim24
          type: access
          __path__: /var/log/nginx/access.log

  # ─── Nginx Error Logs ───
  - job_name: nginx-error
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\]'
      - labels:
          job: nginx
          type: error
          level: ""
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          service: sim24
          type: error
          __path__: /var/log/nginx/error.log

  # ─── Application Logs (via Docker) ───
  - job_name: app-logs
    pipeline_stages:
      - json:
          expressions:
            container_name: container_name
            log: log
      - regex:
          expression: "sim24-(?P<app_instance>app1|app2|worker)"
      - labels:
          app_instance: ""
    static_configs:
      - targets: [localhost]
        labels:
          job: app
          service: sim24
          __path__: /var/lib/docker/containers/*/*-json.log

  # ─── System Logs ───
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: system
          service: sim24
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '^(?P<priority>\<\d+\>)?(?P<timestamp>\w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?P<hostname>\S+)\s+(?P<process>\S+)\[\d+\]:'
      - labels:
          process: ""
      - metrics:
          log_lines_total:
            type: Counter
            description: "Total number of log lines"
            prefix: "promtail_"
            max_idle_duration: 24h
            config:
              match_all: true
              action: inc