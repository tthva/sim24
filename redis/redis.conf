# ============================
# SIM24 — Redis Configuration
# ============================

# ─── Basic Settings ───
daemonize no
pidfile /var/run/redis.pid
loglevel notice
logfile ""

# ─── Persistence ───
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ─── Memory Management ───
maxmemory 200mb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# ─── Performance ───
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ─── Security ───
# Requirepass should be set via REDIS_PASSWORD env variable if needed
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command CONFIG ""

# ─── Slow Log ───
slowlog-log-slower-than 10000
slowlog-max-len 128

# ─── Latency monitoring ───
latency-monitor-threshold 100

# ─── Keyspace notifications (for BullMQ) ───
notify-keyspace-events Ex