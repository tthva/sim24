# ============================
# SIM24 — PostgreSQL HDD-Optimized Configuration
# 16GB Server | 4 Cores | HDD Storage
# ============================

# ─── Memory Settings (HDD-Optimized) ───
shared_buffers = ${POSTGRES_SHARED_BUFFERS:-512MB}
effective_cache_size = ${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
work_mem = ${POSTGRES_WORK_MEM:-32MB}
maintenance_work_mem = ${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
huge_pages = off

# ─── Disk / I/O Settings (HDD-Optimized) ───
random_page_cost = ${POSTGRES_RANDOM_PAGE_COST:-4.0}
# Higher random_page_cost (4.0 instead of default 1.1 for SSD)
# tells the query planner that random disk seeks are expensive.
# This encourages index scans only when truly beneficial.
seq_page_cost = ${POSTGRES_SEQ_PAGE_COST:-2.0}
# Sequential reads are also relatively slower on HDD vs SSD.
effective_io_concurrency = 2
# HDD can handle ~2 concurrent I/O operations

# ─── Write-Ahead Log (WAL) ───
wal_level = replica
max_wal_size = 2GB
min_wal_size = 512MB
wal_buffers = 16MB
wal_writer_delay = 1000ms
# Slightly longer WAL writer delay reduces disk write frequency
wal_sync_method = fdatasync
# fdatasync is more HDD-friendly than fsync

# ─── Query Tuner ───
default_statistics_target = 100
from_collapse_limit = 8
join_collapse_limit = 8
geqo = on

# ─── Autovacuum ───
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.1
# More aggressive vacuum schedule for HDD to prevent bloat

# ─── Parallel queries ───
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000

# ─── Connection settings ───
max_connections = 100
superuser_reserved_connections = 5

# ─── Logging (HDD-friendly) ───
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_statement = 'ddl'
# Only log DDL statements to reduce I/O
log_min_duration_statement = 5000
# Log queries slower than 5 seconds

# ─── Replication ───
max_replication_slots = 0
max_wal_senders = 0
# Disabled since single-server setup

# ─── Performance Tracking ───
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
track_functions = all
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_planning = on