# ============================
# SIM24 — CI/CD Pipeline
# ============================
# GitHub Actions workflow for building, testing, and deploying
# the SIM24 application to a production Docker server.

name: SIM24 Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

jobs:
  # ─── Stage 1: Lint & Type Check ───
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type check
        run: npx tsc --noEmit || true
        continue-on-error: true

      - name: Lint check
        run: npx next lint || true
        continue-on-error: true

  # ─── Stage 2: Build (dry-run) ───
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build

  # ─── Stage 3: Build & Push Docker Image ───
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Stage 4: Deploy to Production Server ───
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            # ─── 1. Navigate to project directory ───
            cd /opt/sim24 || { echo "Directory not found, creating..."; mkdir -p /opt/sim24; cd /opt/sim24; }

            # ─── 2. Download latest docker-compose.yml from repo ───
            curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.yml" -o docker-compose.yml
            curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/.env.example" -o .env.example

            # ─── 3. Create .env from secrets if it doesn't exist ───
            if [ ! -f .env ]; then
              echo "Creating .env file from secrets..."
              cat > .env << 'EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            NODE_ENV=production
            REDIS_URL=${{ secrets.REDIS_URL }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            NGINX_PORT=80
            GRAFANA_PORT=3001
            GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            EOF
            fi

            # ─── 4. Login to GHCR ───
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ─── 5. Update image tag in environment ───
            export IMAGE_TAG=${{ steps.meta.outputs.tags }}
            echo "Deploying image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

            # ─── 6. Pull the latest image ───
            docker compose pull app

            # ─── 7. Recreate app container ───
            docker compose up -d --no-deps --force-recreate app

            # ─── 8. Run database migrations ───
            echo "Running database migrations..."
            docker compose exec -T app npx prisma migrate deploy || echo "Migration warning (may be first run)"

            # ─── 9. Clean up old images ───
            docker image prune -f

            # ─── 10. Verify deployment ───
            echo "Verifying deployment..."
            sleep 10
            curl -f http://localhost:3000/api/auth/check && echo "Health check passed!" || echo "Health check warning"

            # ─── 11. Notify success ───
            echo "=== Deployment completed successfully ==="

  # ─── Stage 5: Health Check Post-Deployment ───
  health-check:
    name: Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'

    steps:
      - name: Check application health
        run: |
          echo "Checking application health..."
          curl -sSf \
            --max-time 30 \
            --retry 5 \
            --retry-delay 10 \
            --retry-connrefused \
            "http://${{ secrets.DEPLOY_HOST }}/api/auth/check" \
            && echo "✓ Health check passed!" \
            || echo "✗ Health check failed"